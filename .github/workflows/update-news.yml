name: Daily AI News Auto-Update

on:
  schedule:
    # 毎日日本時間 7:00 AM (UTC 22:00) に自動実行
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHubの画面から手動実行も可能

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの自動コミット権限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch and summarize AI news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_news.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --staged --quiet; then
            echo "No changes in news data."
          else
            git commit -m "chore: auto-update AI news [skip ci]"
            git push
          fi
